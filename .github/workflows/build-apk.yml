name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare app files
        run: |
          mkdir -p www assets
          echo '' | base64 -d > www/index.html
          echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="كشفي" xmlns:c2pa="http://c2pa.org/manifest"><rect width="64" height="64" rx="14" fill="#14302b"/><path d="M18 11h20l11 11v30a2 2 0 0 1-2 2H18a2 2 0 0 1-2-2V13a2 2 0 0 1 2-2z" fill="#eef2f0"/><path d="M38 11v9a2 2 0 0 0 2 2h9z" fill="#9bb0ab"/><path d="M22 28h13M22 34h9" stroke="#14302b" stroke-width="3" stroke-linecap="round"/><path d="M22 48l7-7 5 4 9-10" stroke="#0f6b5c" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="43" cy="35" r="2.6" fill="#0f6b5c"/><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>' > icon.svg
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon-only.png
      - name: Install Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7 @capacitor/assets@3
          npx cap init "كشفي" dz.kachfy.app --web-dir www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kachfy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
